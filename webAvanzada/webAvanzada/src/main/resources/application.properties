spring.application.name=webAvanzada

# La configuración local sensible vive en config/database.properties (ignorado por Git)
# o se inyecta mediante variables de entorno.
spring.config.import=optional:file:./config/database.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/residencias}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# La base existente se valida al arrancar. Para un entorno desechable se puede
# elegir otro modo con JPA_DDL_AUTO después de revisar el esquema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.documents.storage-path=${DOCUMENTS_STORAGE_PATH:./storage/documentos}
